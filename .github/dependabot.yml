version: 2
updates:
  # Keeps the commit-pinned actions current; one grouped pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The module's dependencies (go.mod, go.sum); one grouped pull request a month.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      gomod:
        patterns: ["*"]
