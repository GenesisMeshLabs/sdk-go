name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Tag Go module release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=main" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              if [ "$version" != "$core" ] && ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::Release $version is not a Genesis Mesh core version (core is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Verify release tag matches declared version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$TAG_VERSION" = "$DECLARED_VERSION"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
