name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue runs the required checks on the queued merge.
  merge_group:

permissions:
  contents: read

jobs:
  # The go.mod minimum and the two latest Go releases (oldstable, stable).
  # The required check is the "Go" summary below, whose name never changes
  # when the toolchains do.
  build-and-test:
    name: Go (${{ matrix.toolchain }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: go.mod minimum
            version_file: go.mod
          - toolchain: oldstable
            version: oldstable
          - toolchain: stable
            version: stable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go (${{ matrix.toolchain }})
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.version }}
          go-version-file: ${{ matrix.version_file }}
          cache: true

      - name: Go version
        run: go version

      - name: Verify dependencies
        run: go mod verify

      - name: Verify release version declaration
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # A one-way ratchet: statement coverage may not fall below the floor
      # (the value when the floor was set, rounded down). Raise the floor
      # when coverage rises; never lower it to merge a change.
      - name: Coverage floor
        env:
          FLOOR_TOTAL: "88"
          FLOOR_VERIFIER: "87"
        run: scripts/coverage_floor.sh coverage.out

  # The stable required check over the toolchain matrix: it fails when any
  # toolchain failed or was cancelled (a skipped matrix is not a pass).
  go:
    name: Go
    if: always()
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Every Go toolchain passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | length > 0 and all(.value.result == "success")' > /dev/null

  # Short fuzz runs of the parsers every verification starts from: strict
  # JSON, the canonical form and the decision decoder (genesismesh/fuzz_test.go).
  # `go test` above runs the same targets on their seed corpus.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Fuzz every target for 10 seconds
        run: |
          set -euo pipefail
          targets="$(go test -list '^Fuzz' ./genesismesh | grep '^Fuzz' || true)"
          if [ -z "$targets" ]; then
            echo "::error::No fuzz target found in ./genesismesh"
            exit 1
          fi
          for target in $targets; do
            echo "::group::$target"
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 10s ./genesismesh
            echo "::endgroup::"
          done

  # Known vulnerabilities in the module's dependencies and the Go standard
  # library it calls (govulncheck, pinned).
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck
        run: govulncheck ./...

  # Every client method against a running Network Authority: each typed
  # result must model the JSON the NA sent (v1.0.2: most of them did not).
  live-contract:
    name: Live contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # name when it exists, and against main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then ref="$BRANCH"; fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true
      # Skipped is not green: GM_E2E_REQUIRED=1 makes the test fail rather
      # than skip without an NA, and the step fails unless TestLiveContract
      # itself ran and passed (a filter matching no test exits 0 in Go).
      - name: Typed results match a live Network Authority
        run: |
          set -o pipefail
          go test -tags live -count=1 -v -run '^TestLiveContract$' ./genesismesh | tee live-contract.log
          grep -q '^--- PASS: TestLiveContract ' live-contract.log || {
            echo "::error::TestLiveContract did not run and pass"
            exit 1
          }
        env:
          GM_E2E_PYTHON: python
          GM_E2E_REQUIRED: "1"

  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            # A pull request is checked against the core branch of the same name when it
            # exists: the core's release/X.Y.Z while the train's release PRs are open, so
            # they pass together. The core still merges first: a push to main reads the
            # core's main. This workflow does not run on tags; publish.yml checks a tag,
            # which must also match a core tag.
            core_ref=main
            if [ -n "${GITHUB_HEAD_REF:-}" ] && git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$GITHUB_HEAD_REF" > /dev/null; then
              core_ref="$GITHUB_HEAD_REF"
            fi
            ref_query="$(jq -rn --arg ref "$core_ref" '$ref | @uri')"
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=$ref_query" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            echo "Release train verified: $version (core $core)"

  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pull requests add changelog.d/<version>/<name>.md; only a release PR
      # (branch release/...) folds them into CHANGELOG.md, so a feature PR for
      # the next version never conflicts with the release of this one.
      - name: Pull requests add fragments; only a release edits CHANGELOG.md
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/changelog.py check ${BASE_REF:+--base origin/$BASE_REF} --branch "$HEAD_REF"
